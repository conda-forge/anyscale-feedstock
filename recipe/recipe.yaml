schema_version: 1

context:
  version: "0.26.111"

package:
  name: anyscale
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/f9/7f/8d4d79179199a313a923c6c0a566779381303c4189d91d5baf3ca713924f/anyscale-${{ version }}.tar.gz
  sha256: b89ad0581cf49af10b4c9b26c2b71b29d29935846247e1aaa9ea6b35e9b05d35

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv
  python:
    entry_points:
      - anyscale = anyscale.scripts:main

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
    - setuptools_scm
  run:
    - python >=${{ python_min }},<3.15
    - boto3 >=1.26.76
    - botocore >=1.19.52
    - aiohttp >=3.7.4
    - certifi >=2024.8.30
    - click >=7.0
    - colorama
    - gitpython
    - google-auth
    - jsonpatch
    - jsonschema
    - python-kubernetes
    - oauth2client
    - packaging
    - pathspec >=0.8.1
    - python-dateutil
    - requests
    - rich
    - six >=1.10
    - tabulate
    - urllib3 >=1.26.17
    - wrapt
    - pyyaml
    - smart_open
    - tqdm
    - tzlocal
    - humanize
    - typing_extensions
    - halo
    - log_symbols >=0.0.14
    - spinners >=0.0.24
    - termcolor >=1.1.0
    - colorama >=0.3.9
    - websockets
    # - argon2-cffi
    # - tabulate

tests:
  - python:
      imports:
        - anyscale
      pip_check: true
      python_version:
        - ${{ python_min }}
        - "*"
  - requirements:
      run:
        - python ${{ python_min }}.*
        # until https://github.com/pypa/pip/issues/12884 is fixed
        - pip <24.2
    script:
      - anyscale --version

about:
  homepage: https://docs.anyscale.com/reference/cli
  summary: Command Line Interface for Anyscale
  description: Command Line Interface for Anyscale
  license: LicenseRef-AS
  license_file: LICENSE
  documentation: https://docs.anyscale.com/reference/cli

extra:
  recipe-maintainers:
    - timkpaine
